<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firmware update · ReBLLED</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<main class="wrap page">
  <header class="pagehead"><a href="/">← Lights</a><h1>Firmware update</h1></header>

  <section aria-labelledby="h-now">
    <h2 id="h-now" class="visually-hidden">Installed</h2>
    <p id="current">Installed: checking…</p>
    <p class="hint">Settings are kept through an update. A backup first is still wise: <a href="/backuprestore">Back up and restore</a>.</p>
  </section>

  <section aria-labelledby="h-up">
    <h2 id="h-up">Install a new version</h2>
    <form class="card" id="form" novalidate>
      <div class="field"><label for="file">Firmware file (<code>.bin.ota</code>)</label>
        <input type="file" id="file" accept=".ota" aria-describedby="fileHint">
        <p class="hint" id="fileHint">The over-the-air file, e.g. <code>ReBLLED_V1.0.0.bin.ota</code>, not the larger <code>.bin</code> for USB.</p>
        <p class="err" id="fileErr" hidden></p></div>
      <progress id="progress" max="100" value="0" hidden aria-label="Upload progress"></progress>
      <div class="inline"><button type="submit" class="primary" id="go" disabled>Install</button></div>
      <p class="status-line" id="state" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  let before = "";
  async function version() { const r = await fetch("/api/status", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return (await r.json()).firmware || ""; }
  version().then(v => { before = v; $("current").textContent = "Installed: ReBLLED " + (v || "(version unknown)"); }).catch(() => { $("current").textContent = "Installed: couldn't ask the controller."; });

  const say = (text, cls) => { $("state").className = "status-line" + (cls ? " " + cls : ""); $("state").textContent = text; };
  // An ESP32 firmware image starts with 0xE9; catches the wrong file before it's uploaded.
  async function checkFile(f) {
    if (!f) return "Choose a firmware file.";
    if (!/\.ota$/i.test(f.name)) return "That isn't a .bin.ota file.";
    const b = new Uint8Array(await f.slice(0, 1).arrayBuffer());
    if (b[0] !== 0xE9) return "That file isn't firmware for this controller.";
    return "";
  }
  $("file").addEventListener("change", async () => {
    const problem = await checkFile($("file").files[0]);
    $("fileErr").textContent = problem; $("fileErr").hidden = !problem; $("file").setAttribute("aria-invalid", String(!!problem));
    $("go").disabled = !!problem; say("");
  });

  async function waitForReboot() {
    await new Promise(r => setTimeout(r, 6000));
    for (let i = 0; i < 40; i++) {
      try {
        const v = await version();
        $("current").textContent = "Installed: ReBLLED " + v;
        say(v && v !== before ? `Updated to ReBLLED ${v}.` : `It's back (ReBLLED ${v || ", version unknown"}).`, "good");
        const a = document.createElement("a"); a.href = "/"; a.textContent = " Back to the lights"; $("state").appendChild(a);
        return;
      } catch (e) {}
      await new Promise(r => setTimeout(r, 2000));
    }
    say("It hasn't come back yet. Wait a minute and reload. If it never does, the USB recovery is in the project's README.", "bad");
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = $("file").files[0], problem = await checkFile(f);
    if (problem) { $("fileErr").textContent = problem; $("fileErr").hidden = false; $("file").focus(); return; }
    $("go").disabled = $("file").disabled = true;
    const fd = new FormData(); fd.append("firmware", f, f.name);
    const x = new XMLHttpRequest();
    $("progress").hidden = false; $("progress").value = 0;
    say("Uploading… Keep this page open.");
    x.upload.onprogress = ev => { if (ev.lengthComputable) $("progress").value = Math.round(ev.loaded / ev.total * 100); };
    x.onload = () => {
      $("progress").hidden = true;
      if (x.status !== 200) {   // refused or failed: the controller keeps running the old version
        say((x.responseText || "Update failed (HTTP " + x.status + ").") + " The installed version is unchanged.", "bad");
        $("go").disabled = $("file").disabled = false; return;
      }
      say("Uploaded. The controller is restarting with the new version…");
      waitForReboot();
    };
    x.onerror = () => { $("progress").hidden = true; say("The upload was cut off. The installed version is unchanged; try again.", "bad"); $("go").disabled = $("file").disabled = false; };
    x.open("POST", "/update"); x.setRequestHeader("X-BLLED", "1"); x.send(fd);
  });
})();
</script>
</body>
</html>
