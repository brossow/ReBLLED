<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/ui.css">
<style>
.logbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 14px; }
button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
#log { margin: 10px 0 0; padding: 10px 12px; height: calc(100dvh - 190px); min-height: 260px; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  font: .82rem/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
#log .t { color: var(--muted); }
#log .note { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main class="wrap page">
  <header class="pagehead"><a href="/">← Lights</a><h1>Log</h1></header>
  <div class="logbar">
    <span class="conn down" id="conn" role="status">Connecting…</span>
    <span class="inline">
      <button type="button" id="pause" aria-pressed="false">Pause scrolling</button>
      <button type="button" id="stamps" aria-pressed="true">Times</button>
      <button type="button" id="save">Download</button>
      <button type="button" id="clear">Clear</button>
    </span>
  </div>
  <pre id="log" tabindex="0" aria-label="Log lines from the controller"></pre>
  <p class="hint">Detailed LED decisions and printer messages appear here when they're turned on under Advanced on the main page. Shows what happens while this page is open; nothing is kept on the controller.</p>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const MAX_LINES = 3000, log = $("log");
  let paused = false, stamps = true, ws = null, pingTimer = null, pongWait = null, retry = 1000;

  const two = n => String(n).padStart(2, "0");
  function add(text, note) {
    const line = document.createElement("div");
    if (stamps) { const d = new Date(), t = document.createElement("span"); t.className = "t"; t.textContent = `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())} `; line.appendChild(t); }
    const body = document.createElement("span"); if (note) body.className = "note"; body.textContent = text; line.appendChild(body);
    log.appendChild(line);
    while (log.childElementCount > MAX_LINES) log.firstElementChild.remove();
    if (!paused) log.scrollTop = log.scrollHeight;
  }
  function setConn(text, ok) { $("conn").textContent = text; $("conn").classList.toggle("down", !ok); }

  function connect() {
    setConn("Connecting…", false);
    try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/webserialws"); }
    catch (e) { return later(); }
    ws.onopen = () => { retry = 1000; setConn("Connected", true); add("Connected.", true); ping(); };
    ws.onmessage = ev => {
      if (ev.data === "pong") { clearTimeout(pongWait); pongWait = null; return; }
      for (const l of String(ev.data).replace(/\r/g, "").split("\n")) if (l) add(l);
    };
    ws.onclose = () => { clearInterval(pingTimer); clearTimeout(pongWait); setConn("Not connected. Retrying…", false); later(); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  function later() { setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); }
  // Keepalive: the controller answers "ping" with "pong"; no answer in 4 s = reconnect.
  function ping() {
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (!ws || ws.readyState !== 1 || pongWait) return;
      ws.send("ping");
      pongWait = setTimeout(() => { add("No answer from the controller. Reconnecting…", true); try { ws.close(); } catch (e) {} }, 4000);
    }, 3000);
  }

  function toggle(btn, on) { btn.setAttribute("aria-pressed", String(on)); }
  $("pause").addEventListener("click", () => { paused = !paused; toggle($("pause"), paused); if (!paused) log.scrollTop = log.scrollHeight; });
  $("stamps").addEventListener("click", () => { stamps = !stamps; toggle($("stamps"), stamps); });
  $("clear").addEventListener("click", () => { log.textContent = ""; });
  $("save").addEventListener("click", () => {
    const d = new Date(), name = `blled-log-${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}-${two(d.getHours())}${two(d.getMinutes())}.txt`;
    const url = URL.createObjectURL(new Blob([[...log.children].map(l => l.textContent).join("\n") + "\n"], { type: "text/plain" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });
  // Scrolling up to read pauses the auto-scroll; back at the bottom resumes it.
  log.addEventListener("scroll", () => {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 8;
    if (!atBottom && !paused) { paused = true; toggle($("pause"), true); }
    else if (atBottom && paused) { paused = false; toggle($("pause"), false); }
  });
  connect();
})();
</script>
</body>
</html>
