; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
custom_project_name = BLLC
custom_project_codename = Balder
custom_version = 2.3.0-br.7 #BLLC_[Major].[Minor].[Patch]-br.[fork revision]
platform = espressif32@7.1.3 ; pinned (Arduino core 2.0.17) so builds are reproducible
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; 1.875 MB per OTA slot (was 1.25 MB with default.csv). Changing the layout needs ONE USB
; flash (docs/USB-MIGRATION.md); after that OTA works as before. Builds still OTA onto the
; old layout while they fit in 1.25 MB (merge_firmware.py warns when they don't).
board_build.partitions = min_spiffs.csv
build_flags = 
	-DVERSION=${this.custom_version}
	-DSTRVERSION=\""${this.custom_version}"\"
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
extra_scripts = 
	pre:pre_build.py
	merge_firmware.py
lib_deps = 
	bblanchon/ArduinoJson@7.4.2
	knolleary/pubsubclient@2.8.0
	luc-github/ESP32SSDP@1.2.1
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
	mathieucarbou/MycilaWebSerial@8.2.3

; Host-side tests of the real firmware logic: `pio test -e native` (see test/).
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Itest/shim -DUNITY_INCLUDE_DOUBLE -DARDUINOJSON_ENABLE_ARDUINO_STRING=1 -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1 -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0 -DARDUINOJSON_ENABLE_PROGMEM=0 -Wno-deprecated-declarations
test_ignore = test_cert
lib_compat_mode = off
lib_deps =
	bblanchon/ArduinoJson@7.4.2

; The printer certificate check (src/blled/printerCert.h) against mbedtls on the host:
; `brew install mbedtls`, then `pio test -e native_tls`. Separate so the other host tests
; don't need it.
[env:native_tls]
platform = native@1.2.1
test_framework = unity
test_build_src = no
test_filter = test_cert
build_flags = -std=gnu++17 -I/opt/homebrew/opt/mbedtls/include -L/opt/homebrew/opt/mbedtls/lib -lmbedx509 -lmbedcrypto -ltfpsacrypto
